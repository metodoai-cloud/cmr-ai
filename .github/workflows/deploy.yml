name: Auto Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Conectar por SSH y Desplegar
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST || secrets.HOST || secrets.VPS_IP || secrets.SERVER_IP }}
          username: ${{ secrets.VPS_USER || secrets.USERNAME || secrets.USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY || secrets.SSH_KEY || secrets.PRIVATE_KEY }}
          password: ${{ secrets.VPS_PASSWORD || secrets.PASSWORD }}
          port: ${{ secrets.VPS_PORT || secrets.PORT || 22 }}
          script: |
            echo "🚀 Iniciando despliegue en el VPS..."
            
            # 1. Navegar a la carpeta del proyecto
            TARGET_DIR="${{ secrets.VPS_PROJECT_DIR }}"
            if [ -z "$TARGET_DIR" ] || [ ! -d "$TARGET_DIR" ]; then
              for d in /var/www/cmr /var/www/CMR /root/CMR /root/cmr /home/*/CMR /home/*/cmr /root/GESTION\ AG/CMR; do
                if [ -d "$d" ]; then TARGET_DIR="$d"; break; fi
              done
            fi
            cd "${TARGET_DIR:-/var/www/cmr}"
            echo "📂 Directorio de trabajo: $(pwd)"
            
            # 2. Descargar los últimos cambios de GitHub
            git pull origin main
            
            # 3. Instalar dependencias y compilar frontend
            cd frontend
            npm install
            npm run build
            cd ..
            
            # 4. Instalar dependencias de backend si cambiaron
            npm install
            
            # 5. Reiniciar servicios de backend y frontend
            if command -v pm2 &> /dev/null; then
              pm2 restart all || pm2 start npm --name "crm" -- run dev
            fi
            
            echo "✅ ¡Despliegue completado exitosamente!"
