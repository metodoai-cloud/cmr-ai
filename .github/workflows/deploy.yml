name: Auto Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Diagnóstico de Secretos y Variables
        env:
          HAS_SEC_HOST: ${{ secrets.VPS_HOST != '' }}
          HAS_VAR_HOST: ${{ vars.VPS_HOST != '' }}
          HAS_SEC_USER: ${{ secrets.VPS_USER != '' }}
          HAS_VAR_USER: ${{ vars.VPS_USER != '' }}
          HAS_SEC_KEY: ${{ secrets.VPS_SSH_KEY != '' }}
          HAS_VAR_KEY: ${{ vars.VPS_SSH_KEY != '' }}
        run: |
          echo "🔍 Comprobación de configuración:"
          echo "• secrets.VPS_HOST: $HAS_SEC_HOST"
          echo "• vars.VPS_HOST: $HAS_VAR_HOST"
          echo "• secrets.VPS_USER: $HAS_SEC_USER"
          echo "• vars.VPS_USER: $HAS_VAR_USER"
          echo "• secrets.VPS_SSH_KEY: $HAS_SEC_KEY"
          echo "• vars.VPS_SSH_KEY: $HAS_VAR_KEY"

      - name: Desplegar en VPS via SSH
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          SEC_KEY: ${{ secrets.VPS_SSH_KEY }}
          VAR_KEY: ${{ vars.VPS_SSH_KEY }}
          SEC_PASS: ${{ secrets.VPS_PASSWORD }}
          VAR_PASS: ${{ vars.VPS_PASSWORD }}
        run: |
          VPS_SSH_KEY="${SEC_KEY:-$VAR_KEY}"
          VPS_PASSWORD="${SEC_PASS:-$VAR_PASS}"
          
          # Limpiar y separar si VPS_HOST incluye usuario (ej: root@2.25.164.77)
          RAW_HOST="${VPS_HOST:-$SEC_HOST}"
          if [[ "$RAW_HOST" == *"@"* ]]; then
            VPS_USER="${RAW_HOST%%@*}"
            VPS_HOST="${RAW_HOST##*@}"
          else
            VPS_HOST="$RAW_HOST"
          fi
          
          VPS_HOST=$(echo "$VPS_HOST" | tr -d '[:space:]')
          VPS_USER=$(echo "${VPS_USER:-root}" | tr -d '[:space:]')
          
          if [ -z "$VPS_HOST" ]; then
            echo "❌ ERROR: VPS_HOST no está definido."
            exit 1
          fi
          
          if [ -z "$VPS_SSH_KEY" ] && [ -z "$VPS_PASSWORD" ]; then
            echo "❌ ERROR: No se encontró VPS_SSH_KEY ni VPS_PASSWORD."
            echo "👉 Agrega VPS_SSH_KEY (clave privada SSH) o VPS_PASSWORD (contraseña) en Settings -> Secrets."
            exit 1
          fi
          
          mkdir -p ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          
          echo "🚀 Conectando a $VPS_USER@$VPS_HOST..."
          
          if [ -n "$VPS_SSH_KEY" ]; then
            # Validar si pegaron la clave pública por error
            if [[ "$VPS_SSH_KEY" == ssh-* ]] || [[ "$VPS_SSH_KEY" == ecdsa-* ]]; then
              echo "❌ ERROR: Has pegado la clave PÚBLICA en VPS_SSH_KEY."
              echo "👉 Debes pegar la clave PRIVADA (la que empieza con '-----BEGIN OPENSSH PRIVATE KEY-----')."
              exit 1
            fi
            
            # Formatear y asegurar saltos de línea limpios
            printf "%s\n" "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
            echo "" >> ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=15"
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
            SSH_CMD="sshpass -p $VPS_PASSWORD ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=15"
          fi
          
          REMOTE_SCRIPT='
            set -e
            echo "📂 Buscando carpeta del CRM en el VPS..."
            for d in /var/www/cmr /var/www/CMR /root/CMR /root/cmr /home/*/CMR /home/*/cmr /root/GESTION\ AG/CMR /var/www/*; do
              if [ -d "$d" ] && [ -d "$d/.git" ]; then
                cd "$d"
                break
              fi
            done
            echo "📂 Trabajando en: $(pwd)"
            git pull origin main

            # 1. Dependencias Backend
            echo "📦 Instalando dependencias de backend..."
            npm install --include=dev

            # 2. Compilar Frontend
            if [ -d "frontend" ]; then
              echo "🔨 Compilando frontend..."
              cd frontend
              npm install --include=dev
              npm run build
              cd ..

              # Sincronizar frontend a Nginx webroot
              if [ -d "/var/www/html" ]; then
                cp -rf frontend/dist/* /var/www/html/ 2>/dev/null || true
              fi
            fi

            # 3. Compilar Backend
            echo "🔨 Compilando backend..."
            npm run build || true

            # 4. Auto-recuperación de procesos Backend
            echo "🔄 Diagnosticando y reiniciando backend..."

            # Manejo de PM2
            if command -v pm2 &> /dev/null; then
              echo "📋 Estado actual de PM2:"
              pm2 list || true

              # Si no hay ningún proceso corriendo o crm no existe en PM2, iniciarlo
              if ! pm2 describe crm &>/dev/null && ! pm2 describe crm-backend &>/dev/null && ! pm2 describe CRM_IA &>/dev/null && ! pm2 describe crm_ia &>/dev/null; then
                echo "🚀 Iniciando CRM en PM2..."
                pm2 start "npx tsx src/index.ts" --name "crm" || pm2 start npm --name "crm" -- run dev
              else
                echo "🔄 Reiniciando CRM en PM2..."
                pm2 restart all --update-env || pm2 restart crm --update-env || pm2 restart CRM_IA --update-env || pm2 start "npx tsx src/index.ts" --name "crm" || true
              fi
              pm2 save || true
              echo "📋 Estado de PM2 tras reinicio:"
              pm2 list || true
            fi

            # Manejo de Systemd (limpiar estado fallido y reiniciar)
            for svc in crm crm_ia CRM_IA crm-ia crm-backend; do
              if systemctl list-unit-files "$svc.service" 2>/dev/null | grep -q "$svc"; then
                echo "🔄 Servicio systemd $svc detectado. Limpiando estado y reiniciando..."
                systemctl reset-failed "$svc" 2>/dev/null || true
                systemctl restart "$svc" 2>/dev/null || true
                systemctl status "$svc" --no-pager -l 2>/dev/null || true
              fi
            done

            # 5. Comprobar salud del puerto 3005
            echo "🔍 Verificando respuesta del servidor..."
            sleep 4
            HEALTH_CHECK=0
            for port in 3005 3000; do
              if curl -s -f "http://127.0.0.1:$port/api/health" &>/dev/null; then
                echo "✅ Backend respondiendo OK en http://127.0.0.1:$port/api/health"
                HEALTH_CHECK=1
                break
              fi
            done

            if [ $HEALTH_CHECK -eq 0 ]; then
              echo "⚠️ Alerta: El backend no respondió inmediatamente en puerto 3005. Mostrando diagnóstico:"
              if command -v pm2 &> /dev/null; then
                pm2 logs --lines 25 --nostream 2>/dev/null || true
              fi
              ss -tlpn 2>/dev/null | grep -E "3005|3000|node" || true
            fi

            # 6. Recargar Nginx
            echo "🔄 Verificando y recargando Nginx..."
            if command -v nginx &> /dev/null; then
              nginx -t && (systemctl reload nginx || systemctl restart nginx) || echo "⚠️ Revisa la configuración de Nginx"
            fi

            echo "✨ ¡Despliegue y verificación completados exitosamente!"
          '
          
          SUCCESS=0
          for attempt in 1 2 3; do
            echo "🚀 [Intento $attempt/3] Conectando a $VPS_USER@$VPS_HOST..."
            if $SSH_CMD "$VPS_USER@$VPS_HOST" "$REMOTE_SCRIPT"; then
              SUCCESS=1
              break
            else
              echo "⚠️ Intento $attempt falló. Esperando 10 segundos antes de reintentar..."
              sleep 10
            fi
          done
          
          if [ $SUCCESS -ne 1 ]; then
            echo "❌ No se pudo completar la conexión SSH tras 3 intentos."
            exit 1
          fi
