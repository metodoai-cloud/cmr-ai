name: Deploy CRM to Hostinger Web Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & FTP Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Validar Secretos de FTP
        run: |
          MISSING=0
          if [ -z "${{ secrets.HOSTINGER_FTP_HOST }}" ]; then
            echo "❌ Falta el secreto: HOSTINGER_FTP_HOST"
            MISSING=1
          fi
          if [ -z "${{ secrets.HOSTINGER_FTP_USER }}" ]; then
            echo "❌ Falta el secreto: HOSTINGER_FTP_USER"
            MISSING=1
          fi
          if [ -z "${{ secrets.HOSTINGER_FTP_PASSWORD }}" ]; then
            echo "❌ Falta el secreto: HOSTINGER_FTP_PASSWORD"
            MISSING=1
          fi
          if [ $MISSING -eq 1 ]; then
            echo "👉 Configura estos secretos en GitHub: Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          echo "✅ Secretos de FTP validados correctamente."

      - name: Instalar dependencias del Frontend
        working-directory: ./frontend
        run: npm ci

      - name: Compilar Frontend (Vite)
        working-directory: ./frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://excocryhfsfzmxozxcwz.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_JSii8wiUoZMee9VLxi0HQw_eX8_r7K8' }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || '' }}
        run: npm run build

      - name: Preparar carpeta de distribución para Hostinger
        run: |
          rm -rf dist
          mkdir -p dist
          cp -r frontend/dist/. dist/
          echo "📁 Contenido de dist/ preparado:"
          ls -la dist/

      - name: Sanitizar y Preparar Conexión FTP
        id: ftp-config
        env:
          RAW_HOST: ${{ secrets.HOSTINGER_FTP_HOST }}
        run: |
          # Eliminar prefijos de protocolo (ftp://, ftps://, http://, https://), barras y puertos
          CLEAN_HOST=$(echo "$RAW_HOST" | sed -E 's|^[a-zA-Z]+://||' | sed -E 's|/.*$||' | sed -E 's|:[0-9]+$||' | tr -d '[:space:]')
          echo "host=$CLEAN_HOST" >> "$GITHUB_OUTPUT"
          echo "🌐 Host FTP sanitizado: $CLEAN_HOST"

      - name: Desplegar archivos a Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp-config.outputs.host }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./


