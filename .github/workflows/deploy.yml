name: Auto Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Diagnóstico de Secretos y Variables
        env:
          HAS_SEC_HOST: ${{ secrets.VPS_HOST != '' }}
          HAS_VAR_HOST: ${{ vars.VPS_HOST != '' }}
          HAS_SEC_USER: ${{ secrets.VPS_USER != '' }}
          HAS_VAR_USER: ${{ vars.VPS_USER != '' }}
          HAS_SEC_KEY: ${{ secrets.VPS_SSH_KEY != '' }}
          HAS_VAR_KEY: ${{ vars.VPS_SSH_KEY != '' }}
        run: |
          echo "🔍 Comprobación de configuración:"
          echo "• secrets.VPS_HOST: $HAS_SEC_HOST"
          echo "• vars.VPS_HOST: $HAS_VAR_HOST"
          echo "• secrets.VPS_USER: $HAS_SEC_USER"
          echo "• vars.VPS_USER: $HAS_VAR_USER"
          echo "• secrets.VPS_SSH_KEY: $HAS_SEC_KEY"
          echo "• vars.VPS_SSH_KEY: $HAS_VAR_KEY"

      - name: Desplegar en VPS via SSH
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          SEC_KEY: ${{ secrets.VPS_SSH_KEY }}
          VAR_KEY: ${{ vars.VPS_SSH_KEY }}
          SEC_PASS: ${{ secrets.VPS_PASSWORD }}
          VAR_PASS: ${{ vars.VPS_PASSWORD }}
        run: |
          VPS_SSH_KEY="${SEC_KEY:-$VAR_KEY}"
          VPS_PASSWORD="${SEC_PASS:-$VAR_PASS}"
          
          # Limpiar y separar si VPS_HOST incluye usuario (ej: root@2.25.164.77)
          RAW_HOST="${VPS_HOST:-$SEC_HOST}"
          if [[ "$RAW_HOST" == *"@"* ]]; then
            VPS_USER="${RAW_HOST%%@*}"
            VPS_HOST="${RAW_HOST##*@}"
          else
            VPS_HOST="$RAW_HOST"
          fi
          
          VPS_HOST=$(echo "$VPS_HOST" | tr -d '[:space:]')
          VPS_USER=$(echo "${VPS_USER:-root}" | tr -d '[:space:]')
          
          if [ -z "$VPS_HOST" ]; then
            echo "❌ ERROR: VPS_HOST no está definido."
            exit 1
          fi
          
          if [ -z "$VPS_SSH_KEY" ] && [ -z "$VPS_PASSWORD" ]; then
            echo "❌ ERROR: No se encontró VPS_SSH_KEY ni VPS_PASSWORD."
            echo "👉 Agrega VPS_SSH_KEY (clave privada SSH) o VPS_PASSWORD (contraseña) en Settings -> Secrets."
            exit 1
          fi
          
          mkdir -p ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          
          echo "🚀 Conectando a $VPS_USER@$VPS_HOST..."
          
          if [ -n "$VPS_SSH_KEY" ]; then
            echo "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=15"
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
            SSH_CMD="sshpass -p $VPS_PASSWORD ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=15"
          fi
          
          SUCCESS=0
          for attempt in 1 2 3; do
            echo "🚀 [Intento $attempt/3] Conectando a $VPS_USER@$VPS_HOST..."
            if $SSH_CMD "$VPS_USER@$VPS_HOST" "bash -s" << 'EOF'
              set -e
              echo "📂 Buscando carpeta del CRM en el VPS..."
              
              TARGET_DIR=""
              for d in /var/www/cmr /var/www/CMR /root/CMR /root/cmr /home/*/CMR /home/*/cmr /root/GESTION\ AG/CMR /var/www/*; do
                if [ -d "$d" ] && [ -d "$d/.git" ]; then
                  TARGET_DIR="$d"
                  break
                fi
              done
              
              if [ -n "$TARGET_DIR" ]; then
                cd "$TARGET_DIR"
              fi
              
              echo "📂 Trabajando en: $(pwd)"
              git pull origin main
              
              # Instalar dependencias raíz
              npm install --prefer-offline 2>/dev/null || npm install
              
              # Compilar frontend
              if [ -d "frontend" ]; then
                echo "🔨 Compilando frontend..."
                cd frontend
                npm install --prefer-offline 2>/dev/null || npm install
                npm run build
                cd ..
                
                # Sincronizar directorios estáticos
                mkdir -p dist
                cp -rf frontend/dist/* dist/ 2>/dev/null || true
                
                if [ -d "/var/www/html" ]; then
                  cp -rf frontend/dist/* /var/www/html/ 2>/dev/null || true
                fi
              fi
              
              echo "🔄 Reiniciando procesos..."
              if command -v pm2 &> /dev/null; then
                pm2 restart all --update-env || pm2 restart all || true
              fi
              if systemctl is-active --quiet crm 2>/dev/null; then
                systemctl restart crm || true
              fi
              if systemctl is-active --quiet nginx 2>/dev/null; then
                systemctl reload nginx || true
              fi
              
              echo "✨ ¡Despliegue completado exitosamente en el VPS!"
EOF
            then
              SUCCESS=1
              break
            else
              echo "⚠️ Intento $attempt falló. Esperando 10 segundos antes de reintentar..."
              sleep 10
            fi
          done
          
          if [ $SUCCESS -ne 1 ]; then
            echo "❌ No se pudo completar la conexión SSH tras 3 intentos."
            exit 1
          fi
