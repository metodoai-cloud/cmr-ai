<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="ia-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- App Icon Background Frame -->
  <rect width="128" height="128" rx="28" fill="url(#fav-bg)" />
  <rect x="2" y="2" width="124" height="124" rx="26" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.5" />

  <!-- CRM Typography (Bold, Crisp White) -->
  <text
    x="64"
    y="56"
    font-family="'Outfit', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="39"
    font-weight="900"
    letter-spacing="-1.2"
    fill="#ffffff"
    text-anchor="middle"
  >
    CRM
  </text>

  <!-- IA Typography (Electric Cyan Accent) -->
  <text
    x="64"
    y="100"
    font-family="'Outfit', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="38"
    font-weight="900"
    letter-spacing="2"
    fill="url(#ia-grad)"
    text-anchor="middle"
  >
    IA
  </text>
</svg>